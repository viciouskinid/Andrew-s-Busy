<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a16">
<title>Andrew’s Busy</title>
<meta name="apple-mobile-web-app-title" content="Andrew’s Busy">
<meta name="application-name" content="Andrew’s Busy">
<style>
:root{
  color-scheme:light dark;
  --bg:#eef2ef; --card:#fff; --ink:#13201a; --muted:#5d6b64; --line:#d6dfda;
  --accent:#0d7a5a; --on-accent:#fff; --soft:#e2ebe6; --warn:#b45f06; --warn-bg:#fff3e0; --danger:#a3281f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a16; --card:#18261f; --ink:#eaf3ee; --muted:#9bb0a6; --line:#2a3d34;
    --accent:#3ecf9f; --on-accent:#06251b; --soft:#223228; --warn:#ffb74d; --warn-bg:#3a2a10; --danger:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a16; --card:#18261f; --ink:#eaf3ee; --muted:#9bb0a6; --line:#2a3d34;
  --accent:#3ecf9f; --on-accent:#06251b; --soft:#223228; --warn:#ffb74d; --warn-bg:#3a2a10; --danger:#ff8a80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
header{padding:18px 20px 8px}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em}
header p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:24px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.timer{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;overflow:hidden;position:relative;flex:none}
.timer.done{border:2px solid var(--warn);background:var(--warn-bg)}
.timer.fresh:not(.done){border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{margin:0;font-size:1.1rem;font-weight:700;overflow-wrap:anywhere}
.state{color:var(--muted);font-size:.85rem;white-space:nowrap}
.timer.done .state{color:var(--warn);font-weight:700}
.time{font-size:3.4rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;margin:6px 0 10px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.timer.done .bar i{background:var(--warn)}
.acts{display:flex;gap:8px;margin-top:14px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;min-height:48px;padding:0 16px;cursor:pointer;color:var(--ink);background:var(--soft);touch-action:manipulation}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.acts button{flex:1;padding:0 8px}
.acts .go{background:var(--accent);color:var(--on-accent)}
.acts .x{flex:0 0 auto;color:var(--danger)}
.state.btns{display:flex;gap:8px;align-items:center}
.sm{min-height:44px;padding:0 16px;border-radius:12px}
.sm.go{background:var(--accent);color:var(--on-accent)}
.sm.x{color:var(--danger);padding:0 14px}
dock,.dock{display:flex;gap:12px;align-items:center;padding:12px 16px 14px;background:var(--card);border-top:1px solid var(--line)}
.status{padding:8px 20px 0;color:var(--muted);font-size:.9rem;min-height:2.2em;background:var(--card)}
.mic{flex:1;min-height:64px;border-radius:32px;background:var(--accent);color:var(--on-accent);font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:10px}
.mic.on{animation:pulse 1.2s ease-in-out infinite}
.mic:disabled{opacity:.45}
.add{min-height:64px;border-radius:32px;padding:0 22px}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--accent) 30%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:3px solid var(--on-accent);outline-offset:-6px}}
dialog{border:0;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:100%;margin:auto 0 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000a}
dialog h2{margin:0 0 14px;font-size:1.25rem}
label{display:block;font-size:.9rem;color:var(--muted);margin:12px 0 6px}
input{width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-height:44px;border-radius:99px;padding:0 16px}
.sheet-acts{display:flex;gap:10px;margin-top:18px}
.sheet-acts button{flex:1}
.sheet-acts .go{background:var(--accent);color:var(--on-accent)}
select{width:100%;font:inherit;font-size:1.1rem;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{padding:0;accent-color:var(--accent);height:36px}
.check{display:flex;gap:12px;align-items:center;color:var(--ink);font-size:1rem;margin-top:18px}
.check input{width:24px;height:24px;flex:none;padding:0;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0;line-height:1.4}
.cog{flex:none;width:64px;min-height:64px;border-radius:50%;padding:0;font-size:1.5rem}
#settingsSheet{max-height:92dvh;overflow-y:auto}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="black"]{color-scheme:dark;--bg:#000;--card:#111;--ink:#fff;--muted:#a0a0a0;--line:#262626;--accent:#3ecf9f;--on-accent:#06251b;--soft:#1e1e1e;--warn:#ffb74d;--warn-bg:#2a1d08;--danger:#ff8a80}
:root[data-theme="ocean"]{color-scheme:light;--bg:#e8f1f8;--card:#fff;--ink:#10222f;--muted:#587082;--line:#cfdde8;--accent:#1769aa;--on-accent:#fff;--soft:#dce9f3;--warn:#b45f06;--warn-bg:#fff3e0;--danger:#a3281f}
:root[data-theme="sunset"]{color-scheme:light;--bg:#fdeee6;--card:#fff;--ink:#2b1710;--muted:#7a5a4c;--line:#f0d5c8;--accent:#c93f0b;--on-accent:#fff;--soft:#fbe2d5;--warn:#7a5000;--warn-bg:#fff1c9;--danger:#a3281f}
:root[data-theme="midnight"]{color-scheme:dark;--bg:#0b1020;--card:#141b33;--ink:#e8ecff;--muted:#9aa5cf;--line:#263056;--accent:#7c9cff;--on-accent:#0b1020;--soft:#1e2748;--warn:#ffb74d;--warn-bg:#3a2a10;--danger:#ff8a80}
:root[data-theme="berry"]{color-scheme:dark;--bg:#1b0f1c;--card:#291729;--ink:#f8e9f8;--muted:#c3a0c4;--line:#432644;--accent:#ff7ad9;--on-accent:#2b0a27;--soft:#3a2039;--warn:#ffb74d;--warn-bg:#3a2a10;--danger:#ff8a80}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.sm{min-width:48px}
.mic{min-width:0;padding:0 12px;font-size:1rem;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.dock{gap:8px}
.add{padding:0 18px}
.cog{width:56px}
#rotate{display:none}
@media (orientation:landscape) and (max-height:500px){
  #rotate{display:flex;position:fixed;inset:0;z-index:99;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:24px;font-weight:700;font-size:1.2rem}
}
</style>
</head>
<body>
<main id="list" aria-live="off"></main>

<div class="status" id="status" role="status" aria-live="polite"></div>
<div class="dock">
  <button class="mic" id="mic" type="button"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg><span id="micText">Hold to talk</span></button>
  <button class="add" id="addBtn" type="button"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>Add</button>
  <button class="cog" id="cogBtn" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="3.2" stroke-dasharray="3.6 3.6"/></svg></button>
</div>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <h2 id="sheetTitle">New timer</h2>
  <label for="nameIn">Name (optional)</label>
  <input id="nameIn" type="text" maxlength="50" placeholder="e.g. Chicken" autocomplete="off" enterkeyhint="next">
  <label for="minIn">Minutes</label>
  <input id="minIn" type="number" inputmode="numeric" min="1" max="1440" step="1" placeholder="5" enterkeyhint="done">
  <div class="chips" id="chips"></div>
  <div class="sheet-acts">
    <button type="button" id="cancelSheet">Cancel</button>
    <button type="button" id="saveSheet" class="go">Start timer</button>
  </div>
</dialog>

<dialog id="settingsSheet" aria-labelledby="setTitle">
  <h2 id="setTitle">Settings</h2>
  <label for="themeSel">Theme</label>
  <select id="themeSel"></select>
  <label for="accentSel">Accent colour</label>
  <select id="accentSel"></select>
  <label class="check"><input id="holdChk" type="checkbox"> Hold the mic button to talk</label>
  <label for="soundSel">Alarm sound</label>
  <select id="soundSel"></select>
  <label for="volRange">Alarm volume</label>
  <input id="volRange" type="range" min="10" max="100" step="5">
  <label class="check"><input id="voiceChk" type="checkbox"> Speak a message when a timer finishes</label>
  <label for="voiceSel">Voice</label>
  <select id="voiceSel"></select>
  <label for="msgIn">Message</label>
  <input id="msgIn" type="text" maxlength="140" autocomplete="off">
  <p class="hint">Use {name} for the timer name and {time} for how long it ran. For example: “{name} has been going for {time}.”</p>
  <div class="sheet-acts"><button type="button" id="testSound">Test sound</button><button type="button" id="testVoice">Test voice</button></div>
  <div class="sheet-acts"><button type="button" id="closeSettings" class="go">Done</button></div>
  <p class="hint" id="build" title="Build date and time (local)" style="text-align:center;margin-top:14px"></p>
</dialog>

<div id="rotate">Please turn your phone upright.</div>

<script>
/* BUILD STAMP: on EVERY code change set BUILD_STAMP to the current local time (YYYY-MM-DD HH:MM:SS).
   If no clock is available set BUILD_STAMP = 'unknown' and increment BUILD_VERSION; with a clock set BUILD_VERSION = null. */
const BUILD_STAMP   = '2026-11-15 21:51:19'; // BUILD_STAMP
const BUILD_VERSION = null;                  // BUILD_VERSION
const BUILD_NOTE    = 'AI had no clock access — version bumped.';
</script>
<script>
document.getElementById('build').textContent = BUILD_STAMP !== 'unknown'
  ? 'Build ' + BUILD_STAMP
  : 'Build unknown · v' + BUILD_VERSION + ' (' + BUILD_NOTE + ')';
</script>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const listEl = $('list'), statusEl = $('status'), micBtn = $('mic'), micText = $('micText');
  const sheet = $('sheet'), nameIn = $('nameIn'), minIn = $('minIn');
  const KEY = 'cooking-timers-v2';

  let timers = [], nextId = 1, cards = new Map();
  let audioCtx = null, alarmTimer = null, wakeLock = null;
  let holding = false;                       // true while the talk button is held: new timers stack in the order spoken
  const fresh = new Set(); let freshT = null; // just-added timers, highlighted briefly
  const endFresh = () => { clearTimeout(freshT); freshT = setTimeout(() => { fresh.clear(); render(); }, 4000); };

  /* ---------- storage (best effort) ---------- */
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ nextId, timers })); } catch (e) {}
  }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d && Array.isArray(d.timers)) { timers = d.timers; nextId = d.nextId || timers.length + 1; }
    } catch (e) {}
  }

  /* ---------- settings ---------- */
  const SKEY = 'cooking-timers-settings-v1';
  const THEMES = [['system','Match my phone'],['light','Light'],['dark','Dark'],['black','Black (OLED)'],['ocean','Ocean'],['sunset','Sunset'],['midnight','Midnight'],['berry','Berry']];
  const SOUNDS = [['beep','Beep'],['chime','Chime'],['bell','Bell'],['digital','Digital'],['siren','Siren'],['buzzer','Buzzer'],['ping','Ping'],['doorbell','Doorbell'],['xylophone','Xylophone'],['harp','Harp'],['arcade','Arcade'],['clock','Alarm clock'],['fanfare','Fanfare'],['sonar','Sonar'],['none','No sound (voice only)']];
  const ACCENTS = [['default','Theme default'],['green','Green'],['blue','Blue'],['orange','Orange'],['pink','Pink'],['purple','Purple'],['red','Red'],['slate','Slate']];
  const ACC = { green:['#0d7a5a','#3ecf9f'], blue:['#1769aa','#6cb4ff'], orange:['#c2570c','#ffa24a'], pink:['#c2307f','#ff7ad9'], purple:['#6d4fc2','#b79bff'], red:['#c0392b','#ff7b6e'], slate:['#374151','#cbd5e1'] };
  function lum(hex) {
    if (hex.length === 4) hex = '#' + [...hex.slice(1)].map(c => c + c).join('');
    const n = parseInt(hex.slice(1), 16);
    return (.299 * (n >> 16) + .587 * ((n >> 8) & 255) + .114 * (n & 255)) / 255;
  }
  const DEFAULTS = { theme:'system', accent:'slate', hold:true, voiceName:'Catherine', sound:'beep', volume:80, voice:true, message:'{name} has been going for {time}.' };
  let settings = { ...DEFAULTS };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch (e) {}
  if (!settings.migrated2) { settings.accent = 'slate'; settings.voiceName = 'Catherine'; settings.migrated2 = true; }
  function saveSettings() { try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) {} }
  function applyTheme() {
    const r = document.documentElement;
    if (settings.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', settings.theme);
    r.style.removeProperty('--accent'); r.style.removeProperty('--on-accent');
    if (ACC[settings.accent]) {
      const bg = getComputedStyle(r).getPropertyValue('--bg').trim();
      const a = ACC[settings.accent][lum(bg) < .5 ? 1 : 0];
      r.style.setProperty('--accent', a); r.style.setProperty('--on-accent', lum(a) > .6 ? '#111' : '#fff');
    }
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = getComputedStyle(r).getPropertyValue('--bg').trim() || '#0f1a16';
  }
  applyTheme();
  function spoken(ms) {
    const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    const pl = (n, u) => `${n} ${u}${n === 1 ? '' : 's'}`, p = [];
    if (h) p.push(pl(h, 'hour')); if (m) p.push(pl(m, 'minute')); if (r) p.push(pl(r, 'second'));
    return p.length > 1 ? p.slice(0, -1).join(', ') + ' and ' + p[p.length - 1] : (p[0] || '0 seconds');
  }
  const fillMsg = (tpl, name, ms) => tpl.replace(/\{name\}/gi, name).replace(/\{time\}/gi, spoken(ms));

  const PATHS = {
    pause: '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>',
    play: '<path d="M8 5v14l11-7z"/>',
    close: '<path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/>',
    restart: '<path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>',
    check: '<path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>'
  };
  const ico = n => `<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true">${PATHS[n]}</svg>`;

  /* ---------- helpers ---------- */
  const say = msg => { statusEl.textContent = msg; };
  const left = t => t.done ? 0 : t.endAt ? Math.max(0, t.endAt - Date.now()) : t.left;
  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
    const p = n => String(n).padStart(2, '0');
    return h ? `${h}:${p(m)}:${p(r)}` : `${p(m)}:${p(r)}`;
  }
  function speak(msg) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg); u.lang = 'en-AU'; u.rate = .95;
      const vv = settings.voiceName && (speechSynthesis.getVoices().find(v => v.name === settings.voiceName)
        || speechSynthesis.getVoices().find(v => v.name.toLowerCase().includes(settings.voiceName.toLowerCase())));
      if (vv) { u.voice = vv; u.lang = vv.lang; }
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* ---------- audio alarm ---------- */
  function unlockAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AC) audioCtx = new AC();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function tone(freq, start, dur, type, vol, freqEnd) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, start);
    if (freqEnd) o.frequency.linearRampToValueAtTime(freqEnd, start + dur);
    const peak = Math.max(.001, vol * settings.volume / 100);
    g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(peak, start + .02);
    g.gain.exponentialRampToValueAtTime(.0001, start + dur);
    o.connect(g).connect(audioCtx.destination); o.start(start); o.stop(start + dur + .05);
  }
  function playSound(kind) {
    unlockAudio();
    if (!audioCtx || kind === 'none') return;
    const t = audioCtx.currentTime + .02;
    if (kind === 'beep') [0, 1, 2].forEach(i => tone(880, t + i * .25, .18, 'sine', .4));
    else if (kind === 'chime') [659, 784, 988].forEach((f, i) => tone(f, t + i * .3, .9, 'sine', .35));
    else if (kind === 'bell') { tone(523, t, 1.6, 'triangle', .35); tone(1047, t, 1.2, 'sine', .2); tone(1568, t + .01, .8, 'sine', .1); }
    else if (kind === 'digital') [0, 1, 2, 3].forEach(i => tone(1200, t + i * .14, .08, 'square', .18));
    else if (kind === 'siren') { tone(600, t, .5, 'sawtooth', .18, 1000); tone(1000, t + .5, .5, 'sawtooth', .18, 600); }
    else if (kind === 'buzzer') [0, 1].forEach(i => tone(160, t + i * .4, .3, 'sawtooth', .3));
    else if (kind === 'ping') [0, .5].forEach(d => tone(1568, t + d, .7, 'sine', .3));
    else if (kind === 'doorbell') { tone(659, t, .9, 'sine', .35); tone(523, t + .55, 1.2, 'sine', .35); }
    else if (kind === 'xylophone') [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, t + i * .14, .35, 'triangle', .3));
    else if (kind === 'harp') [392, 494, 587, 784, 988, 1175].forEach((f, i) => tone(f, t + i * .09, 1, 'sine', .25));
    else if (kind === 'arcade') [0, 1, 2].forEach(i => tone(500, t + i * .22, .15, 'square', .15, 1500));
    else if (kind === 'clock') [0, 1, 2, 3, 4, 5, 6, 7].forEach(i => tone(2000, t + (i < 4 ? i * .09 : .55 + (i - 4) * .09), .05, 'square', .15));
    else if (kind === 'fanfare') [[523, 0], [523, .15], [523, .3], [659, .5], [784, .7], [1047, .95]].forEach(([f, d]) => tone(f, t + d, .3, 'square', .14));
    else if (kind === 'sonar') { tone(1000, t, 1.4, 'sine', .35); tone(1000, t + .7, 1, 'sine', .12); }
  }
  let ringCount = 0;
  function speakDone() {
    if (!settings.voice) return;
    const tpl = (settings.message || '').trim() || DEFAULTS.message;
    const msg = timers.filter(t => t.done).map(t => fillMsg(tpl, t.label, t.total)).join(' ');
    if (msg.trim()) speak(msg);
  }
  function ring() {
    if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    playSound(settings.sound);
    if (ringCount % 5 === 0) setTimeout(speakDone, settings.sound === 'none' ? 0 : 1100);
    ringCount++;
  }
  function syncAlarm() {
    const ringing = timers.some(t => t.done);
    if (ringing && !alarmTimer) { ringCount = 0; ring(); alarmTimer = setInterval(ring, 2000); }
    if (!ringing && alarmTimer) { clearInterval(alarmTimer); alarmTimer = null; try { speechSynthesis.cancel(); } catch (e) {} }
  }

  /* ---------- keep screen awake while timing ---------- */
  async function syncWake() {
    const running = timers.some(t => t.endAt && !t.done);
    try {
      if (running && !wakeLock && navigator.wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!running && wakeLock) { await wakeLock.release(); wakeLock = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { syncWake(); tick(); } });

  /* ---------- timer actions ---------- */
  function addTimer(label, seconds, quiet) {
    let name = (label || '').replace(/\s+/g, ' ').trim().slice(0, 50);
    if (!name) { let n = 1; while (timers.some(x => x.label === 'Timer ' + n)) n++; name = 'Timer ' + n; }
    if (!Number.isFinite(seconds) || seconds < 1) { say('Choose a duration of at least one second.'); return false; }
    const ms = seconds * 1000;
    const t = { id: nextId++, label: name, total: ms, endAt: Date.now() + ms, left: ms, done: false };
    timers.unshift(t); fresh.add(t.id); if (!holding) endFresh();
    if (!quiet) say(`${name} timer set for ${fmt(ms)}.`);
    commit(); return t;
  }
  const byId = id => timers.find(t => t.id === id);
  function pauseResume(t) {
    if (t.endAt) { t.left = left(t); t.endAt = null; }
    else { t.endAt = Date.now() + t.left; }
    commit();
  }
  function restart(t) { t.done = false; t.left = t.total; t.endAt = Date.now() + t.total; commit(); }
  function remove(t) { timers = timers.filter(x => x !== t); commit(); }
  function commit() {
    if (!holding) timers.sort((a, b) => left(a) - left(b));   // soonest first (finished = 0, so they stay on top)
    save(); render(); syncAlarm(); syncWake();
  }

  /* ---------- rendering (cards are kept, only text updates on tick) ---------- */
  function btn(text, cls, fn, aria) {
    const b = document.createElement('button');
    b.type = 'button'; if (text.includes('<svg')) b.innerHTML = text; else b.textContent = text; if (cls) b.className = cls;
    if (aria) b.setAttribute('aria-label', aria);
    b.addEventListener('click', fn); return b;
  }
  function render() {
    listEl.innerHTML = ''; cards = new Map();
    if (!timers.length) {
      listEl.innerHTML = '<div class="empty"><b>No timers running</b>Hold the mic and say “5 minutes chicken, 10 minutes rice”, or press Add.</div>';
      return;
    }
    timers.forEach(t => {
      const card = document.createElement('article'); card.className = 'timer' + (t.done ? ' done' : '') + (fresh.has(t.id) ? ' fresh' : '');
      const top = document.createElement('div'); top.className = 'top';
      const h = document.createElement('h2'); h.className = 'name'; h.textContent = t.label;
      const st = document.createElement('div'); st.className = 'state btns';
      if (t.done) st.textContent = 'Finished!';
      else st.append(
        btn(t.endAt ? ico('pause') : ico('play'), 'sm go', () => pauseResume(t), t.endAt ? `Pause ${t.label} timer` : `Resume ${t.label} timer`),
        btn(ico('close'), 'sm x', () => remove(t), `Cancel ${t.label} timer`)
      );
      top.append(h, st);
      const time = document.createElement('div'); time.className = 'time';
      time.textContent = fmt(left(t));
      const bar = document.createElement('div'); bar.className = 'bar';
      const fill = document.createElement('i'); bar.appendChild(fill);
      const acts = document.createElement('div'); acts.className = 'acts';
      if (t.done) {
        acts.append(btn(ico('restart') + 'Restart', '', () => restart(t)), btn(ico('check') + 'Dismiss', 'go', () => remove(t)));
      }
      card.append(top, time, bar); if (t.done) card.append(acts); listEl.appendChild(card);
      cards.set(t.id, { time, fill });
      paint(t);
    });
  }
  function paint(t) {
    const c = cards.get(t.id); if (!c) return;
    const l = left(t);
    c.time.textContent = fmt(l);
    c.fill.style.width = (t.done ? 0 : Math.min(100, l / t.total * 100)) + '%';
  }
  function tick() {
    let changed = false;
    timers.forEach(t => {
      if (t.endAt && !t.done && Date.now() >= t.endAt) {
        t.done = true; t.endAt = null; t.left = 0; changed = true;
        say(`${t.label} timer is finished.`);
      }
    });
    if (changed) commit(); else timers.forEach(paint);
  }
  setInterval(tick, 250);

  /* ---------- add-timer sheet ---------- */
  [1, 3, 5, 10, 15, 20, 30, 45].forEach(m => {
    $('chips').appendChild(btn(`${m} min`, '', () => { minIn.value = m; }));
  });
  $('addBtn').addEventListener('click', () => { unlockAudio(); nameIn.value = ''; minIn.value = ''; sheet.showModal(); nameIn.focus(); });
  $('cancelSheet').addEventListener('click', () => sheet.close());
  function saveSheet() {
    const mins = Number(minIn.value);
    if (!Number.isFinite(mins) || mins <= 0 || mins > 1440) { minIn.focus(); say('Enter between 1 and 1440 minutes.'); return; }
    if (addTimer(nameIn.value, Math.round(mins * 60))) sheet.close();
  }
  $('saveSheet').addEventListener('click', saveSheet);
  minIn.addEventListener('keydown', e => { if (e.key === 'Enter') saveSheet(); });

  /* ---------- voice command parsing ---------- */
  const ONES = { zero:0, one:1, two:2, three:3, four:4, five:5, six:6, seven:7, eight:8, nine:9, ten:10, eleven:11, twelve:12,
    thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19 };
  const TENS = { twenty:20, thirty:30, forty:40, fifty:50, sixty:60, seventy:70, eighty:80, ninety:90 };
  const UNIT = '(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)';
  const FILLER = new Set(['please','set','start','create','add','make','a','an','the','new','timer','for','and','of','now','me','my','to','on','about','another']);

  function normalise(t) {
    t = t.toLowerCase().replace(/[,.!?]/g, ' ').replace(/-/g, ' ');
    t = t.replace(/\bhalf an? hour\b/g, '30 minutes').replace(/\ban? (hour|minute)\b/g, '1 $1');
    t = t.replace(new RegExp(`\\b(${Object.keys(TENS).join('|')})(?:\\s+(one|two|three|four|five|six|seven|eight|nine))?\\b`, 'g'),
      (_, a, b) => String(TENS[a] + (b ? ONES[b] : 0)));
    t = t.replace(new RegExp(`\\b(${Object.keys(ONES).join('|')})\\b(?=\\s*${UNIT}\\b)`, 'g'), (_, w) => String(ONES[w]));
    return t.replace(/\s+/g, ' ').trim();
  }
  /* A phrase can hold several timers. Two styles, decided per phrase:
       time first: "5 minutes chicken, 10 minutes rice"   (words after each time are its name)
       name first: "chicken 5 minutes, rice 10 minutes"   (words before each time are its name)
     Fillers like "timer for", "set a", "and" are ignored. */
  function parseTimers(raw) {
    const text = normalise(raw);
    const re = new RegExp(`(\\d+(?:\\.\\d+)?)\\s*${UNIT}\\b`, 'g');
    const spans = [];
    for (const m of text.matchAll(re)) {
      const v = Number(m[1]), u = m[2][0], secs = u === 'h' ? v * 3600 : u === 'm' ? v * 60 : v, rank = u === 'h' ? 3 : u === 'm' ? 2 : 1;
      const last = spans[spans.length - 1];
      // "1 hour 30 minutes" / "1 hour and 30 minutes" is one duration
      if (last && rank < last.rank && /^(\s|and)*$/.test(text.slice(last.end, m.index))) { last.end = m.index + m[0].length; last.secs += secs; last.rank = rank; }
      else spans.push({ start: m.index, end: m.index + m[0].length, secs, rank });
    }
    const clean = s => {
      const tk = s.split(' ').filter(Boolean);
      while (tk.length && FILLER.has(tk[0])) tk.shift();
      while (tk.length && FILLER.has(tk[tk.length - 1])) tk.pop();
      return tk.join(' ');
    };
    if (!spans.length) return { items: [], words: clean(text) };
    const seg = spans.map((s, i) => clean(text.slice(i ? spans[i - 1].end : 0, s.start)));
    seg.push(clean(text.slice(spans[spans.length - 1].end)));      // seg[k] sits before span k; seg[n] is the tail
    const nameFirst = seg[0] !== '';
    const items = [];
    spans.forEach((s, k) => {
      const secs = Math.round(s.secs);
      if (secs < 1 || secs > 86400) return;
      items.push({ seconds: secs, label: nameFirst ? seg[k] : seg[k + 1] });
    });
    return { items, words: '', tail: nameFirst ? seg[spans.length] : '' };   // name-first tail = start of the next name
  }
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';

  /* ---------- speech recognition ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.disabled = true; micText.textContent = 'No voice';
    say('Voice isn’t supported in this browser. Use Add instead.');
  } else {
    function diagMic() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { say('This browser can’t reach the microphone on this page. Use Add.'); return; }
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(s => { s.getTracks().forEach(t => t.stop()); say('The microphone works, but voice recognition couldn’t use it. Try again, or use Add.'); })
        .catch(err => say(err.name === 'NotFoundError' ? 'No microphone was found on this device. Use Add.'
          : err.name === 'NotAllowedError' ? 'The microphone is blocked for this page. The app showing it may not allow it. Use Add, or host the file on your own site.'
          : `Microphone error: ${err.name}. Use Add.`));
    }
    const PAIR_WINDOW = 10000;                 // how long a time/name may wait for its other half (ms)
    let rec = null, startWatch = null, wantOn = false, multi = false, restartT = null, quickFails = 0, heardAny = false, announce = true;
    let pendName = '', pendNameAt = 0, pendTimer = null, pendTimerAt = 0;   // half-finished timers across pauses
    const clearPending = () => { pendName = ''; pendTimer = null; };
    const resetMic = () => { clearTimeout(startWatch); micBtn.classList.remove('on'); micText.textContent = settings.hold ? 'Hold to talk' : 'Tap to talk'; };

    // One finished phrase from the recogniser.
    function handlePhrase(alts) {
      const now = Date.now();
      if (pendName && now - pendNameAt > PAIR_WINDOW) pendName = '';
      if (pendTimer && now - pendTimerAt > PAIR_WINDOW) pendTimer = null;
      let p = null;
      for (const a of alts) { const q = parseTimers(a); if (q.items.length) { p = q; break; } }
      if (!p) {                                                     // words only, no time
        const w = parseTimers(alts[0]).words;
        if (!w) { say(`Heard “${alts[0]}”, but no time or name. Try “5 minutes chicken”.`); return; }
        if (pendTimer && timers.includes(pendTimer)) {              // "5 minutes" … pause … "chicken"
          pendTimer.label = cap(w).slice(0, 50); const t = pendTimer; pendTimer = null; commit();
          say(`${t.label} timer set for ${fmt(t.total)}. Still listening…`); return;
        }
        pendName = pendName ? pendName + ' ' + w : w; pendNameAt = now;   // "chicken" … pause … "5 minutes"
        say(`Heard “${pendName}”. Now say how long. Still listening…`); return;
      }
      const made = [];
      p.items.forEach((it, i) => {
        let label = it.label;
        if (!label && i === 0 && pendName) label = pendName;
        const t = addTimer(cap(label), it.seconds, true);
        if (t) made.push({ t, named: !!label });
      });
      pendName = ''; pendTimer = null;
      const lastItem = made[made.length - 1];
      if (lastItem && !lastItem.named) { pendTimer = lastItem.t; pendTimerAt = now; }   // may still get a name
      if (p.tail) { pendName = p.tail; pendNameAt = now; }
      if (made.length) say((made.length > 1 ? `${made.length} timers set` : `${made[0].t.label} timer set for ${fmt(made[0].t.total)}`) + (multi && wantOn ? '. Still listening…' : '.'));
    }

    function startSession() {
      const r = new SR();
      r.lang = 'en-AU'; r.continuous = multi; r.interimResults = false; r.maxAlternatives = 3;
      let errored = false, gotResult = false, nextIdx = 0, lastFinal = '', began = Date.now();
      r.onstart = () => {
        clearTimeout(startWatch); began = Date.now();
        micBtn.classList.add('on'); micText.textContent = multi ? 'Listening…' : 'Tap to stop';
        if (announce) say(multi ? 'Listening. Say “5 minutes chicken, 10 minutes rice”. Pause whenever you like, then let go when done.' : 'Listening. Say “timer for 5 minutes for chicken”.');
        announce = false;
      };
      r.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const res = e.results[i];
          if (!res.isFinal || i < nextIdx) continue;                // Android can resend earlier results
          nextIdx = i + 1;
          const alts = [...res].map(a => a.transcript.trim()).filter(Boolean);
          if (!alts.length) continue;
          // Android sometimes sends each phrase as "everything so far": keep only the new part
          if (lastFinal && alts[0].length > lastFinal.length && alts[0].toLowerCase().startsWith(lastFinal.toLowerCase())) {
            alts.splice(0, alts.length, alts[0].slice(lastFinal.length).trim()); if (!alts[0]) continue;
          }
          lastFinal = (alts[0] || '').trim();
          gotResult = true; heardAny = true; quickFails = 0;
          handlePhrase(alts);
        }
      };
      r.onerror = e => {
        if (multi && wantOn && (e.error === 'no-speech' || e.error === 'aborted')) return;   // just restart in onend
        errored = true;
        if (e.error === 'audio-capture') { say('Checking the microphone…'); diagMic(); return; }
        say(e.error === 'not-allowed' || e.error === 'service-not-allowed'
          ? 'The microphone is blocked on this page. Open the link directly in Chrome or Safari (not inside another app), or use Add.'
          : e.error === 'no-speech' ? 'Didn’t hear anything. Tap the mic and try again.'
          : e.error === 'network' ? 'Voice needs an internet connection. Use Add instead.'
          : e.error === 'aborted' ? 'Voice stopped.'
          : `Voice error: ${e.error}. Use Add instead.`);
      };
      r.onend = () => {
        if (rec === r) rec = null;
        // Still holding the button: the browser ended the session on silence, so listen again.
        if (multi && wantOn && !errored) {
          if (!gotResult && Date.now() - began < 700) quickFails++;
          if (quickFails < 5) { micText.textContent = 'Listening…'; restartT = setTimeout(() => { if (wantOn && !rec) startSession(); }, 60); return; }
          say('Voice keeps stopping. Let go and hold again, or use Add.');
        }
        wantOn = false; clearPending(); resetMic();
        if (holding) { holding = false; commit(); endFresh(); }   // button released: sort by time remaining
        if (!errored && !heardAny && !quickFails) say(settings.hold ? 'Didn’t catch anything. Hold the button while you speak, then let go.' : 'Didn’t catch anything. Tap the mic and try again.');
        quickFails = 0;
      };
      rec = r;
      if (!micBtn.classList.contains('on')) micText.textContent = 'Starting…';
      clearTimeout(startWatch);
      startWatch = setTimeout(() => {
        if (rec === r && !micBtn.classList.contains('on')) {
          wantOn = false; try { r.abort(); } catch (e) {}
          rec = null; resetMic(); if (holding) { holding = false; commit(); endFresh(); }
          say('Voice isn’t responding here. Open the link directly in Chrome or Safari, or use Add.');
        }
      }, 5000);
      try { r.start(); }
      catch (e) { wantOn = false; rec = null; resetMic(); if (holding) { holding = false; commit(); endFresh(); } say(`Couldn’t start voice (${e.name || 'error'}). Open the link directly in Chrome or Safari, or use Add.`); }
    }

    function voiceToggle(mode) {
      unlockAudio();
      if (rec || wantOn) {
        if (mode !== 'start') { wantOn = false; clearTimeout(restartT); if (rec) { try { rec.stop(); } catch (e) {} } else { clearPending(); resetMic(); if (holding) { holding = false; commit(); endFresh(); } } }
        return;
      }
      if (mode === 'stop') return;
      try {
        if (document.featurePolicy && !document.featurePolicy.allowsFeature('microphone')) {
          say('This page is shown inside a frame that blocks the microphone, so voice can’t work here. Use Add, or host the file on your own site.');
          return;
        }
      } catch (e) {}
      wantOn = true; multi = settings.hold; holding = multi; quickFails = 0; heardAny = false; announce = true; clearPending();
      startSession();
    }
    micBtn.addEventListener('pointerdown', e => {
      if (!settings.hold) return;
      e.preventDefault();
      try { micBtn.setPointerCapture(e.pointerId); } catch (x) {}
      voiceToggle('start');
    });
    micBtn.addEventListener('pointerup', () => { if (settings.hold) voiceToggle('stop'); });
    micBtn.addEventListener('pointercancel', () => { if (settings.hold) voiceToggle('stop'); });
    micBtn.addEventListener('click', () => { if (!settings.hold) voiceToggle('toggle'); });
    micBtn.addEventListener('contextmenu', e => e.preventDefault());
  }

  /* ---------- settings sheet ---------- */
  const settingsSheet = $('settingsSheet');
  const fillSelect = (el, list) => list.forEach(([v, l]) => { const o = document.createElement('option'); o.value = v; o.textContent = l; el.appendChild(o); });
  fillSelect($('themeSel'), THEMES); fillSelect($('soundSel'), SOUNDS); fillSelect($('accentSel'), ACCENTS);
  $('cogBtn').addEventListener('click', () => {
    $('themeSel').value = settings.theme; $('soundSel').value = settings.sound;
    $('volRange').value = settings.volume; $('voiceChk').checked = settings.voice; $('msgIn').value = settings.message;
    $('accentSel').value = settings.accent; $('holdChk').checked = settings.hold; populateVoices();
    unlockAudio(); settingsSheet.showModal();
  });
  $('closeSettings').addEventListener('click', () => settingsSheet.close());
  $('themeSel').addEventListener('change', e => { settings.theme = e.target.value; saveSettings(); applyTheme(); });
  $('soundSel').addEventListener('change', e => { settings.sound = e.target.value; saveSettings(); playSound(settings.sound); });
  $('volRange').addEventListener('input', e => { settings.volume = Number(e.target.value); saveSettings(); });
  $('volRange').addEventListener('change', () => playSound(settings.sound));
  $('voiceChk').addEventListener('change', e => { settings.voice = e.target.checked; saveSettings(); });
  $('msgIn').addEventListener('input', e => { settings.message = e.target.value; saveSettings(); });
  $('testSound').addEventListener('click', () => playSound(settings.sound));
  $('testVoice').addEventListener('click', () => speak(fillMsg((settings.message || '').trim() || DEFAULTS.message, 'Chicken', 300000)));

  function populateVoices() {
    const sel = $('voiceSel');
    if (!('speechSynthesis' in window)) { sel.disabled = true; return; }
    const all = speechSynthesis.getVoices();
    let list = all.filter(v => /^en/i.test(v.lang) || v.name === settings.voiceName || v.name.toLowerCase().includes((settings.voiceName || '\u0000').toLowerCase()));
    if (!list.length) list = all;
    sel.innerHTML = '';
    const d = document.createElement('option'); d.value = ''; d.textContent = 'Phone default'; sel.appendChild(d);
    list.forEach(v => { const o = document.createElement('option'); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o); });
    sel.value = settings.voiceName;
    if (settings.voiceName && sel.value !== settings.voiceName) {
      const m = [...sel.options].find(o => o.value && o.value.toLowerCase().includes(settings.voiceName.toLowerCase()));
      if (m) sel.value = m.value;
    }
  }
  if ('speechSynthesis' in window) { populateVoices(); speechSynthesis.addEventListener('voiceschanged', populateVoices); }
  $('accentSel').addEventListener('change', e => { settings.accent = e.target.value; saveSettings(); applyTheme(); });
  $('holdChk').addEventListener('change', e => {
    settings.hold = e.target.checked; saveSettings();
    if (!micBtn.disabled && !micBtn.classList.contains('on')) micText.textContent = settings.hold ? 'Hold to talk' : 'Tap to talk';
  });
  $('voiceSel').addEventListener('change', e => {
    settings.voiceName = e.target.value; saveSettings();
    speak(fillMsg((settings.message || '').trim() || DEFAULTS.message, 'Chicken', 300000));
  });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
  if (!micBtn.disabled) micText.textContent = settings.hold ? 'Hold to talk' : 'Tap to talk';

  /* ---------- go ---------- */
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  load(); render(); syncAlarm(); syncWake();
})();
</script>
</body>
</html>
